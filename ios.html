<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Purin Controller</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .dashboard { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; }
        button { background: #38bdf8; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="dashboard">
        <button id="connectBtn">Connect Robot</button>
        <p id="status">Status: Disconnected</p>
        <div id="dataView" style="font-family: monospace; font-size: 12px; word-break: break-all;">No data yet...</div>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; 
        const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; 

        let rxCharacteristic;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(RX_UUID);
                const txCharacteristic = await service.getCharacteristic(TX_UUID);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = new TextDecoder().decode(event.target.value);
                    document.getElementById('dataView').innerText = value;
                    console.log("Raw Data Received:", value);
                });

                document.getElementById('status').innerText = "Status: Connected";
            } catch (error) {
                document.getElementById('status').innerText = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
