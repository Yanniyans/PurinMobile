<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purin Controller</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; touch-action: manipulation; }
        .dashboard { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; }
        button { background: #38bdf8; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; color: #000; font-size: 16px;}
        button:active { opacity: 0.7; }
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; text-align: center; }
        .btn-stop { background: #ef4444; color: white; }
        #modeDisplay { text-align: center; font-size: 20px; font-weight: bold; color: #f8fafc; margin: 15px 0; padding: 10px; background: #000; border-radius: 8px;}
        .safe-mode { color: #ef4444 !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="dashboard">
        <button id="connectBtn" style="width: 100%; margin: 0 0 10px 0;">Connect Robot</button>
        <p id="btStatus" style="margin: 0 0 5px 0; font-size: 12px; text-align: center;">BLE: Disconnected</p>
        
        <div id="modeDisplay">Mode: Manual</div>

        <div class="dpad">
            <div></div>
            <button onmousedown="sendCmd('W')" onmouseup="sendCmd('R')" ontouchstart="sendCmd('W')" ontouchend="sendCmd('R')">W</button>
            <div></div>
            <button onmousedown="sendCmd('A')" onmouseup="sendCmd('R')" ontouchstart="sendCmd('A')" ontouchend="sendCmd('R')">A</button>
            <button class="btn-stop" onclick="sendCmd('R')">STOP</button>
            <button onmousedown="sendCmd('D')" onmouseup="sendCmd('R')" ontouchstart="sendCmd('D')" ontouchend="sendCmd('R')">D</button>
            <div></div>
            <button onmousedown="sendCmd('S')" onmouseup="sendCmd('R')" ontouchstart="sendCmd('S')" ontouchend="sendCmd('R')">S</button>
            <div></div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 15px;">
            <button onclick="sendCmd('L')" style="flex: 1;">Line Follow</button>
            <button onclick="sendCmd('M')" style="flex: 1;">Wall Follow</button>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; 
        const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; 

        let rxCharacteristic;
        const modeDisplay = document.getElementById('modeDisplay');

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('btStatus').innerText = "BLE: Disconnected";
                    document.getElementById('btStatus').style.color = "#ef4444";
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(RX_UUID);
                const txCharacteristic = await service.getCharacteristic(TX_UUID);

                await txCharacteristic.startNotifications();
                
                // LISTEN FOR EMERGENCY "SAFE" BROADCAST
                txCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = new TextDecoder().decode(event.target.value);
                    if (value.includes("SAFE")) {
                        modeDisplay.innerText = "⚠️ SAFE MODE ⚠️";
                        modeDisplay.classList.add('safe-mode');
                    }
                });

                document.getElementById('btStatus').innerText = "BLE: Connected";
                document.getElementById('btStatus').style.color = "#22c55e";
            } catch (error) {
                let realError = error.message || JSON.stringify(error) || "Unknown";
                document.getElementById('btStatus').innerText = "Error: " + realError;
                document.getElementById('btStatus').style.color = "#ef4444";
            }
        });

        // OPTIMISTIC UI UPDATE
        async function sendCmd(cmdChar) {
            if (!rxCharacteristic) return;
            
            // Update the screen instantly based on what we clicked
            modeDisplay.classList.remove('safe-mode'); // Clear red flashing if we send a new command
            
            if (cmdChar === 'L') modeDisplay.innerText = "Mode: Line Follow";
            else if (cmdChar === 'M') modeDisplay.innerText = "Mode: Wall Follow";
            else if (['W','A','S','D'].includes(cmdChar)) modeDisplay.innerText = "Manual: Moving";
            else if (cmdChar === 'R') modeDisplay.innerText = "Manual: Stopped";

            const encoder = new TextEncoder();
            await rxCharacteristic.writeValue(encoder.encode(cmdChar));
        }
    </script>
</body>
</html>
